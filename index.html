<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#ffffff" />

        <!-- OG / Social -->
        <meta property="og:title" content="GXMBY" />
        <meta property="og:description" content="Music by GXMBY" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://gxmbymusic.uk" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="GXMBY" />

        <link rel="preconnect" href="https://www.youtube.com" />
        <link rel="preconnect" href="https://w.soundcloud.com" />

        <title>GXMBY</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Particle field -->
        <canvas id="particleCanvas"></canvas>

        <!-- Ghost text canvas (audio-reactive expanding rings) -->
        <canvas id="ghostCanvas"></canvas>

        <!-- ── Hero ─────────────────────────────────────────── -->
        <header class="hero">
            <h1 id="mainText">GXMBY</h1>
        </header>

        <!-- ── Releases ─────────────────────────────────────── -->
        <main class="releases">
            <h2 class="releases-heading">Releases</h2>

            <!-- Rows are built by media.js from the catalogue -->
            <div id="mediaList" class="media-list"></div>
        </main>

        <footer class="site-footer">
            <nav class="social-links" aria-label="Social links">
                <a
                    href="https://instagram.com/gxmby"
                    target="_blank"
                    rel="noopener noreferrer"
                    >instagram</a
                >
                <a
                    href="https://x.com/gxmbysk"
                    target="_blank"
                    rel="noopener noreferrer"
                    >x</a
                >
                <a
                    href="https://youtube.com/@gxmby"
                    target="_blank"
                    rel="noopener noreferrer"
                    >youtube</a
                >
                <a
                    href="https://soundcloud.com/gxmby"
                    target="_blank"
                    rel="noopener noreferrer"
                    >soundcloud</a
                >
            </nav>
        </footer>

        <!--
        Hidden audio element — the local copy of "Expressions".
        Web Audio analyses this for real-time reactivity while the
        matching YouTube embed plays. Volume is 0; it never audibly plays.
    -->
        <audio
            id="syncAudio"
            src="/audio/001-Expressions.mp3"
            preload="none"
            crossorigin="anonymous"
        ></audio>

        <script src="particles.js"></script>
        <script src="engine.js"></script>
        <script src="media.js"></script>
    </body>
</html>
